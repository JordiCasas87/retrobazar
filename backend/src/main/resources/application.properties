spring.application.name=retro-bazar-backend

# Frontend (local)
app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:4200}

# Database (local)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/retro_bazar?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Europe/Madrid}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Europe/Madrid

# Local development data
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
